const DB_NAME = 'straider';
const STORE = 'kv';
let dbp = null;
function open() {
    return (dbp ||= new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
    }));
}
async function dbGet(key) {
    try {
        const db = await open();
        return await new Promise((res, rej) => {
            const q = db.transaction(STORE).objectStore(STORE).get(key);
            q.onsuccess = () => res(q.result);
            q.onerror = () => rej(q.error);
        });
    }
    catch {
        return undefined;
    }
}
async function dbSet(key, value) {
    try {
        const db = await open();
        db.transaction(STORE, 'readwrite').objectStore(STORE).put(value, key);
    }
    catch { }
}


const springs = new WeakMap();

let x0 = 0, y0 = 0;
const CALM = '.card, .item';
function springFor(el) {
    let s = springs.get(el);
    if (!s) {
        s = new Spring(1, SPRING.press, v => { el.style.scale = v === 1 ? '' : v.toFixed(4); }, 0.0005);
        springs.set(el, s);
    }

}

        springFor(current).to(1, current.matches(CALM) ? SPRING.calm : SPRING.jelly);

}
function installPress() {

        if (!el || el.disabled)

        current = el;

        y0 = e.clientY;

    addEventListener('pointermove', e => { if (current && Math.hypot(e.clientX - x0, e.clientY - y0) > 10)
